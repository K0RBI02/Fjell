name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install the Android platform this project compiles against
        run: sdkmanager "platforms;android-37.2"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew assembleRelease testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: fjell-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
