name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes the running build pointless; cancel it and save the minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the app's version is derived from tags and the commit count

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships an Android SDK; only the platform we compile against is missing.
      # (android-actions/setup-android@v3 fails: it still asks for the removed "tools" package.)
      - name: Install the Android platform this project compiles against
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-37.2"

      - uses: gradle/actions/setup-gradle@v6

      - name: Check style and lint, build and test
        run: ./gradlew ktlintCheck lintRelease assembleRelease verifyRoborazziDebug

      - uses: actions/upload-artifact@v7
        with:
          name: helgeland-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/outputs/roborazzi/
