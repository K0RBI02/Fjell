name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships an Android SDK; only the platform we compile against is missing.
      # (android-actions/setup-android@v3 fails: it still asks for the removed "tools" package.)
      - name: Install the Android platform this project compiles against
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-37.2"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check style, build and test
        run: ./gradlew ktlintCheck assembleRelease verifyRoborazziDebug

      - uses: actions/upload-artifact@v4
        with:
          name: helgeland-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/outputs/roborazzi/
