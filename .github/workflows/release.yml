name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the app's version is derived from tags and the commit count

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships an Android SDK; only the platform we compile against is missing.
      - name: Install the Android platform this project compiles against
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-37.2"

      - uses: gradle/actions/setup-gradle@v4

      # Releases must carry the real key, or updates won't install over the previous version.
      - name: Unpack the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.HELGELAND_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::HELGELAND_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "HELGELAND_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Check style and lint, build and test
        env:
          HELGELAND_KEYSTORE_PASSWORD: ${{ secrets.HELGELAND_KEYSTORE_PASSWORD }}
          HELGELAND_KEY_ALIAS: ${{ secrets.HELGELAND_KEY_ALIAS }}
          HELGELAND_KEY_PASSWORD: ${{ secrets.HELGELAND_KEY_PASSWORD }}
        run: ./gradlew ktlintCheck lintRelease assembleRelease verifyRoborazziDebug

      - name: Publish the release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "helgeland-${GITHUB_REF_NAME}.apk"
          # Notes come from this version's section in CHANGELOG.md ("## 1.1" for tag v1.1).
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " {p = ($2 == v)} p && !/^## /' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no '## ${GITHUB_REF_NAME#v}' section"; exit 1; }
          gh release create "$GITHUB_REF_NAME" "helgeland-${GITHUB_REF_NAME}.apk" --title "Helgeland ${GITHUB_REF_NAME#v}" --notes-file notes.md
