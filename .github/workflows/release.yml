name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships an Android SDK; only the platform we compile against is missing.
      - name: Install the Android platform this project compiles against
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-37.2"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check style, build and test
        run: ./gradlew ktlintCheck assembleRelease verifyRoborazziDebug

      - name: Publish the release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "helgeland-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "helgeland-${GITHUB_REF_NAME}.apk" --title "Helgeland ${GITHUB_REF_NAME#v}" --generate-notes
